name: CI

on:
  push:
    branches: ["elyon-barber-v2"]
  pull_request:
    branches: ["elyon-barber-v2"]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
      ADMIN_EMAIL: "ci@example.com"
      ADMIN_PASSWORD: "ci-placeholder-password"
      ADMIN_SESSION_SECRET: "ci-placeholder-session-secret-01234567890123456789"
      SMTP_HOST: "smtp.example.com"
      SMTP_USER: "ci@example.com"
      SMTP_PASS: "ci-placeholder-password"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
